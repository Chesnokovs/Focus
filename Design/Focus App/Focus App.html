<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Focus App — Hi-fi Design</title>
<meta name="viewport" content="width=1600" />
<style>
  :root {
    --font-sans: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --bg-canvas: #f5f4f2;
  }
  body { margin: 0; background: var(--bg-canvas); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); }
  input::placeholder { color: currentColor; opacity: .5; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/Icon.jsx"></script>
<script type="text/babel" src="components/MainWindow.jsx"></script>
<script type="text/babel" src="components/FocusOverlay.jsx"></script>

<script type="text/babel">
const App = () => (
  <DesignCanvas title="Focus App — hi-fi" subtitle="Silver / blue-gray darker themes (with overlay C)">
    <DCSection id="darker" title="Darker silver / blue-gray themes" subtitle="Modern, premium feel — not as harsh as pure black">
      <DCArtboard id="silver" label="A · Silver — mid-tone steel" width={860} height={680}>
        <Scene theme="silver" bg="linear-gradient(135deg,#1c2530 0%,#2a3440 100%)" />
      </DCArtboard>
      <DCArtboard id="gunmetal" label="B · Gunmetal — deeper steel blue" width={860} height={680}>
        <Scene theme="gunmetal" bg="linear-gradient(135deg,#15212e 0%,#1f2731 100%)" />
      </DCArtboard>
      <DCArtboard id="pewter" label="C · Pewter — warm-cool steel" width={860} height={680}>
        <Scene theme="pewter" bg="linear-gradient(135deg,#1f2230 0%,#2e3340 100%)" />
      </DCArtboard>
    </DCSection>

    <DCSection id="lighter-ref" title="Lighter themes (reference)" subtitle="From the previous round">
      <DCArtboard id="paper" label="Paper" width={860} height={680}>
        <Scene theme="paper" bg="#e7e3dc" lightAura />
      </DCArtboard>
      <DCArtboard id="cream" label="Cream" width={860} height={680}>
        <Scene theme="cream" bg="#d8cfb8" lightAura />
      </DCArtboard>
      <DCArtboard id="slate" label="Slate" width={860} height={680}>
        <Scene theme="slate" bg="#c8d0dc" lightAura />
      </DCArtboard>
    </DCSection>

    <DCSection id="overlay" title="Focus overlay — variant C (confirmed)">
      <DCArtboard id="ov-c" label="Overlay C · pinned top-right" width={420} height={140}>
        <div style={{
          width: '100%', height: '100%',
          background: '#2a2540',
          backgroundImage: 'radial-gradient(circle at 30% 30%,rgba(255,255,255,.06),transparent 50%)',
          display: 'grid', placeItems: 'center',
        }}>
          <FocusOverlay width={380} variant="C" />
        </div>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

const Scene = ({ theme, bg, lightAura }) => (
  <div style={{
    width: '100%', height: '100%',
    background: bg,
    backgroundImage: lightAura
      ? 'radial-gradient(circle at 15% 20%,rgba(255,255,255,.25),transparent 35%),radial-gradient(circle at 85% 85%,rgba(0,0,0,.06),transparent 40%)'
      : 'radial-gradient(circle at 20% 25%,rgba(255,255,255,.06),transparent 40%),radial-gradient(circle at 85% 85%,rgba(0,0,0,.25),transparent 50%)',
    display: 'grid', placeItems: 'center',
    position: 'relative', overflow: 'hidden',
    padding: 20,
  }}>
    <div style={{ position: 'relative' }}>
      <MainWindow width={740} height={600} theme={theme} />
      <div style={{ position: 'absolute', top: 50, right: -160 }}>
        <FocusOverlay width={300} variant="C" />
      </div>
    </div>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
